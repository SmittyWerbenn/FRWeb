    <title>Portal Admin | Sinartrans Logistics</title>
    <script type="text/javascript">
      // Demo ini dilayani dari subfolder /assets/template/sinartrans/ di
      // frel.cloud. Semua URL aset (logo, wasm) memakai prefiks ini.
      window.__SNT_DEMO_BASE__ = "/assets/template/sinartrans";
      // Entry khusus Portal Admin.
      // BASE_URL SPA tetap relatif (BASE_URL bundle di-override ke path folder ini),
      // tapi portal dipaksa "admin" supaya route admin berada di root basename
      // (mis. /login, /pengiriman) dan tidak diredirect ke subdomain admin.
      window.__SNT_PORTAL__ = "admin";
      // Router basename = BASE_URL (folder ini). Arahkan ke /login di dalam
      // basename tersebut SEBELUM bundle dimuat, supaya SPA mount pada Login.
      window.__SNT_ADMIN_ENTRY__ = "./login";
      try {
        var base = window.location.pathname.replace(/\/admin\.html$/, "").replace(/\/$/, "");
        if (window.location.pathname.indexOf("/login") === -1) {
          window.history.replaceState(null, "", base + "/login");
        }
      } catch (e) {
        /* abaikan bila History API diblokir */
      }
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/assets/template/sinartrans/assets/index-DUVzfaO_.js"></script>
