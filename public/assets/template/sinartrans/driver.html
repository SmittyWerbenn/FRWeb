    <title>Portal Driver | Sinartrans Logistics</title>
    <script type="text/javascript">
      // Demo ini dilayani dari subfolder /assets/template/sinartrans/ di
      // frel.cloud. Semua URL aset (logo, wasm) memakai prefiks ini.
      window.__SNT_DEMO_BASE__ = "/assets/template/sinartrans";
      // Entry khusus Portal Driver.
      // Router SPA berbasis path (BrowserRouter), jadi portal kurir dipilih
      // lewat flag ini (bukan query string): detectPortal() membaca
      // window.__SNT_PORTAL__ sebelum fallback ke hostname.
      window.__SNT_PORTAL__ = "driver";
      try {
        var base = window.location.pathname.replace(/\/driver\.html$/, "").replace(/\/$/, "");
        if (window.location.pathname.indexOf("/login") === -1) {
          window.history.replaceState(null, "", base + "/login");
        }
      } catch (e) {
        /* abaikan bila History API diblokir */
      }
    </script>
